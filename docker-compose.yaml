services:
  # ----------------- Databases -----------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trainer_net

  mongo:
   image: mongo:7
  container_name: mongo_db
  ports:
   - "27017:27017"
   volumes:
    - mongodata:/data/db
  networks:
   - trainer_net
  # ----------------- Redis ---------------------------
  # redis:
  #  image: redis:7
  # container_name: redis
  #ports:
  # - "6379:6379"
  #command: ["redis-server", "--appendonly", "yes"]
  #volumes:
  #  - redis_data:/data
  #networks:
  # - trainer_net

  # ----------------- RabbitMQ -----------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # RabbitMQ broker
      - "15672:15672" # Management dashboard
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - trainer_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------Gateway-----------------
  gateway:
    container_name: gateway
    build:
      context: ./services/gateway
    env_file:
      - ./services/gateway/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./services/gateway:/app
      - /app/node_modules
    networks:
      - trainer_net

  # ----------------- NestJS Auth Service -----------------
  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-service
    env_file:
      - ./services/auth-service/.env
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3000"
    command: >
      sh -c "
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run start:dev
      "
    restart: unless-stopped
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    networks:
      - trainer_net

networks:
  trainer_net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  rabbitmq_data:
  # redis_data:
